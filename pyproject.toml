[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brightloop-monday-deck"
version = "0.1.0"
description = "Builds Maya's Monday competitor deck: what changed on competitor pricing pages and homepages, with every number linked."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tzdata>=2024.1",
    # The app's "Build now" makes .pptx files on Vercel, which installs from this list.
    "python-pptx>=1.0",
]

[project.optional-dependencies]
collect = [
    "playwright>=1.45",
    "python-pptx>=1.0",
]
deck = [
    "python-pptx>=1.0",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
]

[project.scripts]
brightloop = "brightloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
