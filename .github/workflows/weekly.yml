name: weekly

# Maya's deck must be ready before she starts at 08:30 (Israel time) on Monday.
# 05:30 UTC = 07:30 in Israel's winter time (UTC+2) and 08:30 in summer time (UTC+3).
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week, e.g. 2026-W43 (empty = this week)"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[collect]"
      - run: python -m playwright install --with-deps chromium
      - name: Collect, compare, build the deck
        run: brightloop collect ${{ inputs.week && format('--week {0}', inputs.week) || '' }}
      - name: Build the web app
        run: python scripts/build_site.py
      - name: Commit the recording (Vercel redeploys from the repo)
        run: |
          git config user.name "brightloop-bot"
          git config user.email "brightloop-bot@users.noreply.github.com"
          git add recordings public
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Weekly run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
