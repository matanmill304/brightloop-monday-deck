name: daily

# Every day: capture Maya's pages and compare them with the day before.
# Mondays: also roll last week's signals into cases.json, result.json and the deck.
# GitHub starts schedules "best effort": on Oct 24 and 25 the 04:30 UTC run started ~4.5 h late.
# So the first run starts just after midnight Israel time (22:15 UTC = 00:15 winter / 01:15
# summer, already the new day in Israel), with backups every two hours up to 04:30 UTC. Even
# hours late, the deck is ready by 06:30 (Israel), before Maya starts. A backup that finds
# today's scheduled run already done stops at the first step.
on:
  schedule:
    - cron: "15 22 * * *"
    - cron: "15 0 * * *"
    - cron: "15 2 * * *"
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to collect, e.g. 2026-10-23 (empty = today; a past day uses Wayback copies)"
        required: false
      week:
        description: "Also build this ISO week's deck, e.g. 2026-W43 (empty = only on Mondays, last week)"
        required: false
      deliver_week:
        description: "Post this week's deck to Slack now, e.g. 2026-W43 (posts again if it was posted)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: A backup schedule finds today's run already done
        id: done
        if: github.event_name == 'schedule'
        run: |
          today=$(TZ=Asia/Jerusalem date +%F)
          if grep -q "\"date\": \"$today\".*\"trigger\": \"scheduled\"" recordings/runlog.jsonl; then
            echo "today ($today) already ran on schedule: nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.done.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - run: pip install ".[collect]"
        if: steps.done.outputs.skip != 'true'
      # Real Chrome on a virtual screen: Cloudflare blocks headless Chrome on some pages.
      - run: python -m playwright install --with-deps chrome
        if: steps.done.outputs.skip != 'true'
      # Inputs reach the shell as environment variables, never pasted into the script.
      - name: Capture today's pages and compare with the day before
        if: steps.done.outputs.skip != 'true'
        env:
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            xvfb-run -a brightloop collect --date "$DATE" --archived
          else
            xvfb-run -a brightloop collect
          fi
      - name: Monday (Israel time), or a week asked for, build the week's deck
        if: steps.done.outputs.skip != 'true'
        env:
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$WEEK" ]; then
            brightloop week --week "$WEEK"
          elif [ "$(TZ=Asia/Jerusalem date +%u)" = "1" ]; then
            brightloop week
          else
            echo "not Monday: no final deck today"
          fi
      - name: Refresh the week so far (data the app shows; no deck files until Monday)
        if: steps.done.outputs.skip != 'true'
        run: brightloop week --refresh --week "$(TZ=Asia/Jerusalem date +%G-W%V)"
      # Slack, from GitHub secrets (a bot's token and the channel); without them it's skipped
      # and the run log says so.
      - name: Deliver the Monday deck to Slack, or a week asked for
        if: steps.done.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          SLACK_MENTION: ${{ secrets.SLACK_MENTION }}
          DELIVER_WEEK: ${{ inputs.deliver_week }}
          WEEK: ${{ inputs.week }}
        run: |
          if [ -n "$DELIVER_WEEK" ]; then
            brightloop deliver --week "$DELIVER_WEEK" --force
          elif [ -n "$WEEK" ]; then
            brightloop deliver --week "$WEEK"
          elif [ "$(TZ=Asia/Jerusalem date +%u)" = "1" ]; then
            brightloop deliver
          else
            echo "not Monday: nothing to deliver"
          fi
      - name: Build the web app (public/)
        if: steps.done.outputs.skip != 'true'
        env:
          # Whether Slack is connected (true/false), for the Setup page; never the token itself.
          SLACK_CONNECTED: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL != '' }}
        run: python scripts/build_site.py
      - name: Commit the recording and the app (Vercel redeploys from the repo)
        if: steps.done.outputs.skip != 'true'
        run: |
          git config user.name "brightloop-bot"
          git config user.email "brightloop-bot@users.noreply.github.com"
          git add recordings public
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Daily run $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash && git push
      - name: On a Monday, tell Slack the run failed (so Maya doesn't wait for the deck)
        if: failure() && steps.done.outputs.skip != 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
        run: |
          if [ "$(TZ=Asia/Jerusalem date +%u)" = "1" ]; then
            brightloop deliver --failed || echo "couldn't post the failure notice"
          fi
