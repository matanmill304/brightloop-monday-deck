name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest

  # The reviewers' gate: a fresh clone, zero keys, one command.
  fresh-clone-proof:
    runs-on: ubuntu-latest
    env: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: brightloop run --input tests/fixtures/brief_sample.json --output result.json
      - run: python -c "import json; d = json.load(open('result.json')); assert d['built_for'] == 'maya'"
