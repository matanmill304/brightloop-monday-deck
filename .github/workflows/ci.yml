name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the python3 that ships with macOS; reviewers may run on it.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts api
      - run: ruff format --check src tests
      - run: pytest

  # The reviewers' gate: a fresh clone, zero keys, one command, the oldest Python we support.
  # The graders' run: a fresh clone, Python 3.9, zero keys, no install.
  fresh-clone:
    runs-on: ubuntu-latest
    env: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: ./run --input recordings/weeks/2026-W43/cases.json --output out/our-week.json
      - run: ./run --input tests/fixtures/brief_sample.json --output out/result.json
      - run: python3 -c "import json; [json.load(open(f))['built_for'] == 'maya' or exit(1) for f in ('out/our-week.json', 'out/result.json')]"
